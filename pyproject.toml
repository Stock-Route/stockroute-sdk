[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockroute"
version = "0.1.0"
description = "StockRoute 数据 API 官方 Python SDK(A 股行情/财务/资讯,DataFrame-first,PIT 点时财务)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "StockRoute"}]
keywords = ["A股", "量化", "数据", "kline", "financial", "PIT"]
dependencies = ["pandas>=1.5", "requests>=2.28"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://m-stock.600044.xyz"
Documentation = "https://m-stock.600044.xyz"
Repository = "https://github.com/Stock-Route/stockroute-sdk"
